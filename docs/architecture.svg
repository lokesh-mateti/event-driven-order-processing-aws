<svg width="680" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Event-Driven Order Processing Platform Architecture</title>
<desc>Architecture diagram showing the full AWS event-driven order processing flow from API Gateway through Step Functions saga with Bedrock fraud detection to EventBridge fan-out and consumers.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: Arial, sans-serif; fill: #1a1a1a; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; fill: #444; }
  .arr { stroke: #555; stroke-width: 1.2; fill: none; }
  .c-gray rect   { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-blue rect   { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue text   { fill: #0C447C; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text { fill: #3C3489; }
  .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal text   { fill: #085041; }
  .c-amber rect  { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber text  { fill: #633806; }
  .c-coral rect  { fill: #FAECE7; stroke: #993C1D; }
  .c-coral text  { fill: #712B13; }
  .c-pink rect   { fill: #FBEAF0; stroke: #993556; }
  .c-pink text   { fill: #72243E; }
  .c-green rect  { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green text  { fill: #27500A; }
  .c-red rect    { fill: #FCEBEB; stroke: #A32D2D; }
  .c-red text    { fill: #791F1F; }
</style>
</defs>

<!-- CLIENT -->
<g class="c-gray">
  <rect x="250" y="20" width="180" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Client</text>
</g>

<!-- Arrow: Client -> API Gateway -->
<line x1="340" y1="64" x2="340" y2="98" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- API GATEWAY -->
<g class="c-blue">
  <rect x="190" y="98" width="300" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="116" text-anchor="middle" dominant-baseline="central">API Gateway</text>
  <text class="ts" x="340" y="136" text-anchor="middle" dominant-baseline="central" fill="#185FA5">POST /orders</text>
</g>

<!-- Arrow: API Gateway -> order-processor -->
<line x1="340" y1="154" x2="340" y2="188" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- DynamoDB (left) -->
<g class="c-teal">
  <rect x="30" y="200" width="150" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="105" y="218" text-anchor="middle" dominant-baseline="central">DynamoDB</text>
  <text class="ts" x="105" y="238" text-anchor="middle" dominant-baseline="central" fill="#085041">orders (PENDING)</text>
</g>

<!-- ElastiCache (right) -->
<g class="c-amber">
  <rect x="500" y="200" width="150" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="575" y="218" text-anchor="middle" dominant-baseline="central">ElastiCache</text>
  <text class="ts" x="575" y="238" text-anchor="middle" dominant-baseline="central" fill="#633806">Redis product cache</text>
</g>

<!-- order-processor Lambda -->
<g class="c-purple">
  <rect x="190" y="188" width="300" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="206" text-anchor="middle" dominant-baseline="central">order-processor Lambda</text>
  <text class="ts" x="340" y="226" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Validate → write PENDING → start saga</text>
</g>

<!-- Arrows: order-processor <-> DynamoDB -->
<line x1="190" y1="216" x2="180" y2="216" class="arr" marker-end="url(#arrow)" stroke="#555"/>
<line x1="180" y1="228" x2="190" y2="228" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- Arrows: order-processor <-> ElastiCache -->
<line x1="490" y1="216" x2="500" y2="216" class="arr" marker-end="url(#arrow)" stroke="#555"/>
<line x1="500" y1="228" x2="490" y2="228" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- Arrow: order-processor -> Step Functions -->
<line x1="340" y1="244" x2="340" y2="290" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- STEP FUNCTIONS SAGA container -->
<rect x="40" y="290" width="600" height="330" rx="12" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="6 3"/>
<text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central" fill="#555">Step Functions — order-saga</text>

<!-- Reserve -->
<g class="c-teal">
  <rect x="58" y="322" width="102" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="109" y="340" text-anchor="middle" dominant-baseline="central">Reserve</text>
  <text class="ts" x="109" y="358" text-anchor="middle" dominant-baseline="central" fill="#085041">inventory</text>
</g>

<!-- FraudCheck -->
<g class="c-coral">
  <rect x="178" y="322" width="102" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="229" y="340" text-anchor="middle" dominant-baseline="central">Fraud check</text>
  <text class="ts" x="229" y="358" text-anchor="middle" dominant-baseline="central" fill="#712B13">via Bedrock</text>
</g>

<!-- Payment -->
<g class="c-teal">
  <rect x="298" y="322" width="102" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="349" y="340" text-anchor="middle" dominant-baseline="central">Payment</text>
  <text class="ts" x="349" y="358" text-anchor="middle" dominant-baseline="central" fill="#085041">process</text>
</g>

<!-- Confirm -->
<g class="c-teal">
  <rect x="418" y="322" width="102" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="469" y="340" text-anchor="middle" dominant-baseline="central">Confirm</text>
  <text class="ts" x="469" y="358" text-anchor="middle" dominant-baseline="central" fill="#085041">order</text>
</g>

<!-- Done -->
<g class="c-green">
  <rect x="538" y="322" width="82" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="579" y="340" text-anchor="middle" dominant-baseline="central">Done</text>
  <text class="ts" x="579" y="358" text-anchor="middle" dominant-baseline="central" fill="#27500A">succeeded</text>
</g>

<!-- Arrows between saga steps -->
<line x1="160" y1="350" x2="178" y2="350" class="arr" marker-end="url(#arrow)" stroke="#555"/>
<line x1="280" y1="350" x2="298" y2="350" class="arr" marker-end="url(#arrow)" stroke="#555"/>
<line x1="400" y1="350" x2="418" y2="350" class="arr" marker-end="url(#arrow)" stroke="#555"/>
<line x1="520" y1="350" x2="538" y2="350" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- Bedrock box -->
<g class="c-coral">
  <rect x="178" y="420" width="102" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="229" y="436" text-anchor="middle" dominant-baseline="central">Amazon</text>
  <text class="th" x="229" y="452" text-anchor="middle" dominant-baseline="central">Bedrock</text>
</g>
<line x1="229" y1="378" x2="229" y2="420" class="arr" marker-end="url(#arrow)" stroke="#993C1D"/>

<!-- Compensation note -->
<text class="ts" x="340" y="488" text-anchor="middle" dominant-baseline="central" fill="#555">On failure: compensate in reverse — release inventory, mark FAILED</text>
<text class="ts" x="340" y="506" text-anchor="middle" dominant-baseline="central" fill="#555">Each step has a Catch block routing to compensation Lambda</text>

<!-- Compensation failure paths (dashed) -->
<path d="M109 378 L109 530 L255 530" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M229 464 L229 540 L255 540" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M349 378 L349 550 L425 550 L425 574" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- FailOrder box -->
<g class="c-red">
  <rect x="255" y="552" width="170" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="570" text-anchor="middle" dominant-baseline="central">FailOrder</text>
  <text class="ts" x="340" y="586" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">mark FAILED in DynamoDB</text>
</g>

<!-- Arrow: Confirm -> EventBridge -->
<line x1="469" y1="378" x2="469" y2="640" class="arr" marker-end="url(#arrow)" stroke="#555"/>
<line x1="469" y1="640" x2="400" y2="640" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- EVENTBRIDGE -->
<g class="c-pink">
  <rect x="190" y="618" width="210" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="295" y="636" text-anchor="middle" dominant-baseline="central">EventBridge</text>
  <text class="ts" x="295" y="654" text-anchor="middle" dominant-baseline="central" fill="#993556">order-events (ORDER_CONFIRMED)</text>
</g>

<!-- Arrows: EventBridge -> SQS queues -->
<path d="M240 674 L240 720" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M350 674 L350 720" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

<!-- SQS: email queue -->
<g class="c-teal">
  <rect x="100" y="720" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="190" y="738" text-anchor="middle" dominant-baseline="central">order-email-queue</text>
  <text class="ts" x="190" y="756" text-anchor="middle" dominant-baseline="central" fill="#085041">SQS</text>
</g>

<!-- SQS: search queue -->
<g class="c-teal">
  <rect x="400" y="720" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="490" y="738" text-anchor="middle" dominant-baseline="central">order-search-queue</text>
  <text class="ts" x="490" y="756" text-anchor="middle" dominant-baseline="central" fill="#085041">SQS</text>
</g>

<!-- DLQ email (dashed) -->
<g class="c-gray">
  <rect x="30" y="800" width="150" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="105" y="818" text-anchor="middle" dominant-baseline="central">order-email-dlq</text>
  <text class="ts" x="105" y="834" text-anchor="middle" dominant-baseline="central" fill="#444">DLQ (on failure)</text>
</g>
<path d="M140 776 L105 776 L105 800" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- DLQ search (dashed) -->
<g class="c-gray">
  <rect x="500" y="800" width="150" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="575" y="818" text-anchor="middle" dominant-baseline="central">order-search-dlq</text>
  <text class="ts" x="575" y="834" text-anchor="middle" dominant-baseline="central" fill="#444">DLQ (on failure)</text>
</g>
<path d="M540 776 L575 776 L575 800" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Arrows: SQS -> Lambda consumers -->
<line x1="190" y1="776" x2="190" y2="860" class="arr" marker-end="url(#arrow)" stroke="#555"/>
<line x1="490" y1="776" x2="490" y2="860" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- email-consumer Lambda -->
<g class="c-purple">
  <rect x="100" y="860" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="190" y="878" text-anchor="middle" dominant-baseline="central">email-consumer</text>
  <text class="ts" x="190" y="896" text-anchor="middle" dominant-baseline="central" fill="#534AB7">sends via SES</text>
</g>

<!-- search-consumer Lambda -->
<g class="c-purple">
  <rect x="400" y="860" width="180" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="490" y="878" text-anchor="middle" dominant-baseline="central">search-consumer</text>
  <text class="ts" x="490" y="896" text-anchor="middle" dominant-baseline="central" fill="#534AB7">indexes to OpenSearch</text>
</g>

<!-- SES box -->
<g class="c-blue">
  <rect x="100" y="940" width="180" height="34" rx="8" stroke-width="0.5"/>
  <text class="th" x="190" y="957" text-anchor="middle" dominant-baseline="central">Amazon SES</text>
</g>
<line x1="190" y1="916" x2="190" y2="940" class="arr" marker-end="url(#arrow)" stroke="#555"/>

<!-- OpenSearch box -->
<g class="c-blue">
  <rect x="400" y="940" width="180" height="34" rx="8" stroke-width="0.5"/>
  <text class="th" x="490" y="957" text-anchor="middle" dominant-baseline="central">Amazon OpenSearch</text>
</g>
<line x1="490" y1="916" x2="490" y2="940" class="arr" marker-end="url(#arrow)" stroke="#555"/>

</svg>
